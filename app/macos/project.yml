# XcodeGen spec. With XcodeGen installed (`brew install xcodegen`), run
# `xcodegen generate` in this folder to produce VantaPlayground.xcodeproj,
# then open it in Xcode and Run. (Manual Xcode steps are in README.md if you
# would rather not use XcodeGen.)

name: VantaPlayground
options:
  bundleIdPrefix: com.juanshep
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  VantaPlayground:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juanshep.vantaplayground
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Vanta.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
