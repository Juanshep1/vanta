# XcodeGen spec for the native Vanta Studio macOS app.
#   brew install xcodegen   (if needed)
#   cd app/studio && xcodegen generate && open VantaStudio.xcodeproj
# then press Run (Cmd-R).

name: VantaStudio
options:
  bundleIdPrefix: com.juanshep
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:                      # the integrated terminal's VT100/xterm emulator (Run module)
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 8840e3596739adfe9599c0e7fff89f4fa88bedcf   # v1.9.0 (a revision pin: it depends on swift-subprocess by revision)

targets:
  VantaStudio:
    type: application
    platform: macOS
    dependencies:
      - package: SwiftTerm
    sources:
      - path: Sources
      - path: Resources/runtime
        type: folder
      - path: Resources/examples
        type: folder
      - path: Assets.xcassets
        optional: true
    postCompileScripts:           # AI module: bundle The Vanta Book + docs for Vee's knowledge (RAG)
      - name: Bundle Vanta knowledge
        basedOnDependencyAnalysis: false
        script: |
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/knowledge"
          mkdir -p "$DEST/book" "$DEST/docs"
          BOOK="$SRCROOT/../../../vanta-book/chapters"
          DOCS="$SRCROOT/../../docs"
          [ -d "$BOOK" ] && rsync -a --delete --include='*.md' --exclude='*' "$BOOK/" "$DEST/book/"
          [ -d "$DOCS" ] && rsync -a --delete --include='*.md' --exclude='*' "$DOCS/" "$DEST/docs/"
          for PDF in "$SRCROOT/../../../vanta-book/The-Vanta-Book.pdf" "$HOME/Desktop/The-Vanta-Book.pdf" "$HOME/Documents/The-Vanta-Book.pdf"; do
            if [ -f "$PDF" ]; then cp -f "$PDF" "$DEST/The-Vanta-Book.pdf"; break; fi
          done
          exit 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juanshep.vantastudio
        PRODUCT_NAME: Vanta Studio
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
