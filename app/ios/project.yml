# XcodeGen spec for Vanta Pocket — the native iOS IDE for Vanta.
#   brew install xcodegen   (if needed)
#   cd app/ios && xcodegen generate && open VantaPocket.xcodeproj
# then pick a simulator (or your iPhone) and press Run.

name: VantaPocket
options:
  bundleIdPrefix: com.juanshep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  VantaPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/runtime
        type: folder
        buildPhase: resources
      - path: Resources/examples
        type: folder
        buildPhase: resources
      - path: Resources/pyodide
        type: folder
        buildPhase: resources
      - path: ../../vanta.py
        buildPhase: resources
      - path: Assets.xcassets
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juanshep.vantapocket
        PRODUCT_NAME: Vanta Pocket
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
